name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Test and package
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run unit tests
        run: swift test

      - name: Assemble app bundle
        run: ./build-app.sh debug

      - name: Verify bundle signature
        run: codesign --verify --strict build/Pomace.app

      - name: Install Applesauce
        run: brew install Dr-Emann/homebrew-tap/applesauce

      - name: Run sparse-image integration test
        run: ./Tests/integration/sparse-image.sh
