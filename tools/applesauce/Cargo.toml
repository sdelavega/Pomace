[package]
name = "pomace-applesauce"
version = "0.5.30"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Pinned applesauce CLI bundled with Pomace"

[[bin]]
name = "applesauce"
path = "src/main.rs"

[features]
default = ["zlib", "lzfse", "lzvn"]
zlib = ["applesauce/zlib"]
lzfse = ["applesauce/lzfse"]
lzvn = ["applesauce/lzvn"]

[dependencies]
applesauce = { version = "=0.8.10", default-features = false }
cfg-if = "=1.0.5"
clap = { version = "=4.6.7", features = ["derive"] }
humansize = "=2.1.3"
indicatif = "=0.18.6"
tikv-jemallocator = "=0.7.0"
tracing = "=0.1.44"
tracing-chrome = "=0.7.2"
tracing-subscriber = { version = "=0.3.23", features = ["fmt", "env-filter"] }
